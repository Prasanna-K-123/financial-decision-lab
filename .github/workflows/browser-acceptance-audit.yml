name: Independent browser acceptance audit
on:
  push:
    branches: [audit/browser-acceptance-20261020]
    paths:
      - audit/browser_acceptance.mjs
      - audit/browser-plan.json
      - audit/publish_browser_evidence.py
      - .github/workflows/browser-acceptance-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'Prasanna-K-123/financial-decision-lab' && github.ref_name == 'audit/browser-acceptance-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate isolated audit sources
        run: |
          node --check audit/browser_acceptance.mjs
          python3 -m py_compile audit/publish_browser_evidence.py
      - name: Install pinned independent browser toolkit
        run: |
          npm install --prefix audit/runtime --ignore-scripts --no-audit --no-fund playwright@1.64.1
          audit/runtime/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Exercise actual deployed desktop and mobile viewports
        run: node audit/browser_acceptance.mjs
      - name: Preserve bounded evidence on isolated audit branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audit/publish_browser_evidence.py
