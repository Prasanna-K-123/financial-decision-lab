name: Independent workbook application audit
on:
  push:
    branches: [main]
    paths:
      - artifacts/Corporate_Finance_Decision_Lab.xlsx
      - docs/exports/Corporate_Finance_Decision_Lab.xlsx
      - tools/build_workbook.mjs
      - tools/audit_workbooks_libreoffice.py
      - reports/application_audit_plan_20261020.json
      - .github/workflows/workbook-application.yml
  pull_request:
    paths:
      - artifacts/Corporate_Finance_Decision_Lab.xlsx
      - docs/exports/Corporate_Finance_Decision_Lab.xlsx
      - tools/build_workbook.mjs
      - tools/audit_workbooks_libreoffice.py
      - reports/application_audit_plan_20261020.json
      - .github/workflows/workbook-application.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recalculate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile the audit and workbook builder
        run: |
          /usr/bin/python3 -m py_compile tools/audit_workbooks_libreoffice.py
          node --check tools/build_workbook.mjs
      - name: Install the independent spreadsheet application
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno fonts-liberation2
      - name: Recalculate the delivered workbooks against pinned references
        run: /usr/bin/python3 tools/audit_workbooks_libreoffice.py
