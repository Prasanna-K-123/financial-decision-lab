name: Publish reviewed finance release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag pointing to the reviewed main commit
        required: true
        type: string
      reviewed_commit:
        description: Exact reviewed 40-character main commit SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: reviewed-finance-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check dispatch and existing refs before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_guard.py --check
      - run: python -m pip install -r requirements.txt
      - name: Install and verify the original OCR dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['tesseract', '--version'], text=True).splitlines()[0]
          assert version == 'tesseract 5.3.4', version
          data = Path(os.environ['TESSDATA_PREFIX']) / 'eng.traineddata'
          assert hashlib.sha256(data.read_bytes()).hexdigest() == '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
          PY
      - run: python -m unittest discover -s tests -v
      - name: Reacquire pinned originals and repeat source-to-result validation
        run: |
          python tools/acquire_sources.py --output source_cache
          python tools/run_study.py --sources source_cache --decoded work/release/decoded --output work/release/results
          python tools/reproduce_numeric.py
          python tools/build_demo.py
          node tests/check_explorer.cjs
          node tests/check_explorer_interactions.cjs
          node tests/check_portfolio.cjs
          git diff --exit-code -- docs/index.html docs/portfolio.html docs/exports/
      - name: Recheck refs after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_guard.py --check
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck existing tag and main before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_guard.py --publish
