name: Publish audited release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: audited-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUDITED_REPOSITORY: "Prasanna-K-123/financial-decision-lab"
      AUDITED_BASELINE: "e18c9f1c395fb777633d9832bd425a418fa5f2a4"
      RELEASE_TAG: "v1.0.5"
      RELEASE_TITLE: "Corporate Finance Decision Lab — v1.0.5"
      ALLOWED_PATHS: "[\"reports/portfolio_navigation_revision_20261021.json\",\".github/workflows/release.yml\"]"
      APPROVED_SOURCE_BLOBS: "{\"docs/index.html\":\"996c411e881e944a0b46f9df4f665f1368e9fa99\",\"docs/portfolio.html\":\"b623af523b1afb9091cb8c5efe7b5fd332fafffd\",\"README.md\":\"b412e415d65cc86e301d8feff799f2c3c3e51eb1\",\"tests/check_explorer.cjs\":\"b8b6ce6f5be6a226a478054196ee86efee73e0a9\",\"docs/audit/portfolio-viewport-check.html\":\"ec95cf4d8f9a1d9ec0da4fa58316876ff42add7d\"}"
      BROWSER_SOURCE_COMMIT: "44c3ccbe0a59acfc8e98b44e6c4a41288daa3455"
      BROWSER_EVIDENCE_COMMIT: "74eb642e9b5916f0f546da55ea3b24d753c2a236"
      BROWSER_PAGE: "finance"
      RELEASE_NOTES: |
        This maintenance release makes the seven-study portfolio easier to evaluate for risk, insurance, Treasury, finance, analytics and economic-research roles.
        
        - Add a native role selector, explicit methods and 34 direct study-evidence links.
        - Keep all seven studies, original findings and scenario/research boundaries visible.
        - Improve narrow-screen role labels and evidence-text readability.
        - Put Finance README evidence and reproduction before retained maintenance history.
        
        The final deployed portfolio passes 21 role/width checks in Chromium at 320, 390 and 1200 CSS pixels, plus role deep-link, invalid-hash and keyboard checks. Authored DOM content, style and script subtrees match the reviewed source after documented browser serialization/initialization normalization. All 20 direct GitHub file targets exist.
        
        The seven study explorers, scientific results, methods, datasets and workbooks are unchanged. Their prior dated verification records remain separate; this release does not claim fresh Firefox, physical-device or native Excel execution.
        
        Publication requires current-commit research CI, exact approved source identities and the portfolio review receipt.
        
        [Open the portfolio](https://prasanna-k-123.github.io/financial-decision-lab/portfolio.html) · [Navigation verification](https://github.com/Prasanna-K-123/financial-decision-lab/blob/main/reports/portfolio_navigation_revision_20261021.json)
    steps:
      - name: Verify reviewed source and successful audits before publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          baseline=os.environ["AUDITED_BASELINE"]
          tag=os.environ["RELEASE_TAG"]
          def require(ok,message):
              if not ok:raise RuntimeError(message)
          def api(path,payload=None,missing=False):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,data=None if payload is None else json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"audited-presentation-release"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  if missing and e.code==404:return None
                  raise RuntimeError("GitHub API failed for "+path+" (HTTP "+str(e.code)+")") from None
          def public_json(url):
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","User-Agent":"audited-presentation-release"})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def target():
              ref=api("/git/ref/tags/"+tag,missing=True)
              if ref is None:return None
              obj=ref["object"]
              for _ in range(4):
                  if obj["type"]=="commit":return obj["sha"]
                  require(obj["type"]=="tag","Unexpected tag type")
                  obj=api("/git/tags/"+obj["sha"])["object"]
              raise RuntimeError("Excessive tag indirection")
          require(repo==os.environ["AUDITED_REPOSITORY"],"Unexpected repository")
          require(os.environ["GITHUB_REF"]=="refs/heads/main","Publication requires main")
          comparison=api("/compare/"+baseline+"..."+sha)
          require(comparison["status"]=="ahead" and comparison["total_commits"]==1,"Exactly one reviewed maintenance commit required")
          allowed=set(json.loads(os.environ["ALLOWED_PATHS"]))
          require({f["filename"] for f in comparison["files"]}==allowed and all(f["status"] in ("added","modified") for f in comparison["files"]),"Unexpected source changes")
          tree=api("/git/trees/"+sha+"?recursive=1")
          entries={f["path"]:f["sha"] for f in tree["tree"] if f["type"]=="blob"}
          approved=json.loads(os.environ["APPROVED_SOURCE_BLOBS"])
          require(all(entries.get(path)==digest for path,digest in approved.items()),"Published source differs from the reviewed candidate")
          proof_commit=os.environ["BROWSER_EVIDENCE_COMMIT"]
          proof=public_json("https://raw.githubusercontent.com/Prasanna-K-123/financial-decision-lab/"+proof_commit+"/audit/browser-evidence/report.json")
          require(proof["audit_commit"]==os.environ["BROWSER_SOURCE_COMMIT"],"Unexpected browser-audit source")
          require(not proof["failures"] and proof["summary"]["renders"]==48,"Independent browser audit did not pass")
          views=[p for p in proof["pages"] if p["page"]==os.environ["BROWSER_PAGE"]]
          expected=approved["docs/index.html"]
          require(len(views)==6 and all(p["delivered_blob"]==expected and p["expected_blob"]==expected and not p["failures"] for p in views),"Candidate views do not match this HTML")
          browser_run=public_json("https://api.github.com/repos/Prasanna-K-123/financial-decision-lab/actions/runs/"+str(proof["run_id"]))
          require(browser_run["status"]=="completed" and browser_run["conclusion"]=="success","Browser workflow did not finish successfully")
          portfolio=public_json("https://raw.githubusercontent.com/"+repo+"/"+sha+"/reports/portfolio_navigation_revision_20261021.json")
          require(portfolio["status"]=="passed" and portfolio["source_commit"]==baseline,"Unexpected portfolio review source")
          require(portfolio["hub_source_blob"]==approved["docs/portfolio.html"],"Portfolio source identity differs")
          checks=portfolio["browser"]["role_width_checks"]
          require(len(checks)==21 and all(c["pass"] and c["minimumEvidenceFont"]>=14 and c["minimumEvidenceTarget"]>=44 for c in checks),"Portfolio role/width checks failed")
          require({(c["requestedWidth"],c["role"]) for c in checks}=={(w,r) for w in (320,390,1200) for r in ("all","credit","insurance","treasury","finance","analytics","economics")},"Missing portfolio role/width case")
          require(not portfolio["browser"]["failures"] and not portfolio["browser"]["captured_page_console_errors"],"Portfolio page errors remain")
          require(portfolio["source_to_live_dom_comparison"]["matches"] and portfolio["source_link_check"]["all_exist_in_reviewed_public_trees"],"Portfolio evidence checks failed")
          deadline=time.monotonic()+900
          while True:
              runs=api("/actions/runs?head_sha="+sha+"&per_page=100")["workflow_runs"]
              matches=[r for r in runs if r["name"]=="Verify public research" and r["head_sha"]==sha and r["head_branch"]=="main" and r["event"]=="push"]
              latest=max(matches,key=lambda r:r["id"]) if matches else None
              if latest and latest["status"]=="completed":
                  require(latest["conclusion"]=="success","Research CI did not pass")
                  break
              require(time.monotonic()<deadline,"Timed out waiting for research CI")
              time.sleep(10)
          require(api("/branches/main")["commit"]["sha"]==sha,"Main changed during verification")
          require(target() in (None,sha),"Existing tag differs; retagging is forbidden")
          release=api("/releases/tags/"+tag,missing=True)
          notes=os.environ["RELEASE_NOTES"]
          title=os.environ["RELEASE_TITLE"]
          if release is None:
              release=api("/releases",{"tag_name":tag,"target_commitish":sha,"name":title,"body":notes,"draft":False,"prerelease":False,"make_latest":"true"})
          require(not release["draft"] and not release["prerelease"],"Not a final release")
          require(release["tag_name"]==tag and release["name"]==title,"Release identity differs")
          require(release["body"].replace("\r\n","\n").strip()==notes.strip(),"Release notes differ")
          require(target()==sha and api("/releases/latest")["id"]==release["id"],"Latest release is not this tested commit")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("Published ["+tag+"]("+release["html_url"]+") after research CI, retained explorer proof and final portfolio UI/source verification.\n\n")
              summary.write("Scientific datasets, models, saved outcomes and workbooks are byte-identical to the prior audited release.\n")
          print(json.dumps({"tag":tag,"commit":sha,"url":release["html_url"],"research_ci":latest["html_url"],"browser_evidence_commit":proof_commit}))
          
          PY
