name: Publish audited release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: audited-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AUDITED_REPOSITORY: Prasanna-K-123/financial-decision-lab
      AUDITED_BASELINE: 84d9e45602202dfc431771018cc55ea292e1428d
      RELEASE_TAG: v1.0.3
      RELEASE_TITLE: Corporate Finance Decision Lab — v1.0.3
      RELEASE_NOTES: |
        This maintenance release corrects floating-point handling at the workbook's declared minimum one-basis-point terminal spread.

        - The saved XLSX and its builder now use the same scaled-roundoff validation rule as the Python model.
        - Independent LibreOffice Calc verification opens, recalculates, changes inputs, saves and reopens both published finance and Treasury workbooks: 38,935 numerical comparisons pass.
        - All 51 finance spread-boundary probes pass; all nine finance policy cases and the original scientific results are retained.
        - The permanent workbook audit is read-only. Publication waits for both research CI and the independent application audit at the exact tagged commit.

        [Open the evidence browser](https://prasanna-k-123.github.io/financial-decision-lab/).

        Original releases, construction evidence, frozen methods and prediction seals are preserved. Native Microsoft Excel was not executed; scenario values remain conditional research assumptions, not market-calibrated valuations.
    steps:
      - name: Verify the reviewed correction and both successful audits before publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          baseline = os.environ["AUDITED_BASELINE"]
          tag = os.environ["RELEASE_TAG"]
          title = os.environ["RELEASE_TITLE"]
          notes = os.environ["RELEASE_NOTES"]
          api_root = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "audited-research-release",
          }

          def api(path, payload=None, missing_ok=False):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(api_root + path, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(f"GitHub request failed: {path} (HTTP {error.code})") from None

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def tag_commit():
              ref = api("/git/ref/tags/" + tag, missing_ok=True)
              if ref is None:
                  return None
              obj = ref["object"]
              for _ in range(4):
                  if obj["type"] == "commit":
                      return obj["sha"]
                  require(obj["type"] == "tag", "Unexpected tag object type.")
                  obj = api("/git/tags/" + obj["sha"])["object"]
              raise RuntimeError("Tag indirection exceeds the verification limit.")

          require(os.environ["GITHUB_REF"] == "refs/heads/main", "Release must run from main.")
          require(repo == os.environ["AUDITED_REPOSITORY"], "Unexpected repository.")
          comparison = api("/compare/" + baseline + "..." + sha)
          require(comparison["status"] == "ahead", "Audited baseline must be an ancestor.")
          require(comparison["total_commits"] == 1, "Exactly one reviewed workbook-correction commit is required.")
          changes = comparison["files"]
          allowed_paths = ["artifacts/Corporate_Finance_Decision_Lab.xlsx","docs/exports/Corporate_Finance_Decision_Lab.xlsx","tools/build_workbook.mjs","reports/workbook_verification.json","reports/workbook_verification_before_boundary_revision_20261020.json","reports/workbook_validation_revision_20261020.json","reports/workbook_application_verification_20261020.json","reports/application_audit_plan_20261020.json","tools/audit_workbooks_libreoffice.py",".github/workflows/workbook-application.yml","README.md","docs/index.html",".github/workflows/release.yml"]
          require(
              {change["filename"] for change in changes} == set(allowed_paths)
              and all(change["status"] in ("added", "modified") for change in changes),
              "Changes differ from the reviewed workbook correction and verification assets.",
          )

          deadline = time.monotonic() + 900
          while True:
              runs = api("/actions/runs?head_sha=" + sha + "&per_page=100")["workflow_runs"]
              candidates = [
                  run for run in runs
                  if run["name"] == "Verify public research"
                  and run["head_sha"] == sha
                  and run["head_branch"] == "main"
                  and run["event"] == "push"
              ]
              latest = max(candidates, key=lambda run: run["id"]) if candidates else None
              application_runs = [
                  run for run in runs
                  if run["name"] == "Independent workbook application audit"
                  and run["head_sha"] == sha and run["head_branch"] == "main"
                  and run["event"] == "push"
              ]
              application = max(application_runs, key=lambda run: run["id"]) if application_runs else None
              if latest and application and all(
                  run["status"] == "completed" for run in (latest, application)
              ):
                  require(all(run["conclusion"] == "success" for run in (latest, application)),
                          "Research or independent application CI did not pass.")
                  break
              require(time.monotonic() < deadline, "Timed out waiting for research CI.")
              time.sleep(10)

          require(api("/branches/main")["commit"]["sha"] == sha, "Main changed during verification.")
          existing_target = tag_commit()
          require(existing_target in (None, sha), "Existing tag points to a different commit; no retagging is allowed.")
          release = api("/releases/tags/" + tag, missing_ok=True)
          if release is None:
              release = api("/releases", {
                  "tag_name": tag,
                  "target_commitish": sha,
                  "name": title,
                  "body": notes,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })

          require(not release["draft"] and not release["prerelease"], "Release is not a final publication.")
          require(release["tag_name"] == tag and release["name"] == title, "Release identity differs.")
          require(release["body"].replace("\r\n", "\n").strip() == notes.strip(), "Release notes differ.")
          require(tag_commit() == sha, "Published tag does not match the tested commit.")
          require(api("/releases/latest")["id"] == release["id"], "New release is not marked Latest.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Published [{tag}]({release['html_url']}) after successful research CI.\n\n")
              summary.write(f"Audited research baseline: `{baseline}`\n\n")
              summary.write(f"Tagged commit: `{sha}`\n\n")
              summary.write("Scientific data, source valuation code and sealed results are unchanged; the documented workbook validation correction and audit assets are included.\n")
          print(json.dumps({"url": release["html_url"], "tag": tag, "sha": sha, "research_ci": latest["html_url"]}))

          PY
