<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Explorer viewport review</title><style>body{margin:20px;color:#172d3e;background:#edf1f2;font:16px/1.5 system-ui,sans-serif}label{display:inline-block;font-weight:700;margin-right:8px}select{font:inherit;min-height:44px;margin:0 18px 12px 0;padding:8px;max-width:100%}iframe{display:block;width:320px;height:1800px;border:1px solid #647d8c;margin-top:18px;background:white}p{max-width:850px}:focus-visible{outline:3px solid #203d57;outline-offset:3px}</style></head><body>
<h1>Explorer viewport review</h1>
<p>This review frame checks responsive layout at a selected CSS viewport width. It does not emulate a phone, touch input or another browser engine.</p>
<label for="review-project">Explorer</label><select id="review-project"><option value="financial-decision-lab">Corporate finance</option><option value="inflation-vintages">Inflation vintages</option><option value="causal-customer-decisions">Causal decisions</option><option value="insurance-price-reserve-risk">Insurance risk</option><option value="demand-inventory">Demand and inventory</option><option value="credit-risk-model-validation">Credit validation</option><option value="treasury-alm">Treasury ALM</option></select>
<label for="review-width">CSS viewport width</label><select id="review-width"><option value="320">320 px</option><option value="390">390 px</option><option value="1200">1200 px</option></select>
<iframe id="explorer-frame" title="Explorer at selected CSS viewport" src="../index.html"></iframe>
<script>'use strict';const frame=document.getElementById('explorer-frame');document.getElementById('review-width').addEventListener('change',event=>{frame.style.width=event.target.value+'px';});document.getElementById('review-project').addEventListener('change',event=>{frame.src='https://prasanna-k-123.github.io/'+event.target.value+'/';});</script>
</body></html>
